<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours sampled from the logo masters, so the browser chrome, the
         splash and the artwork never disagree. -->
    <meta name="theme-color" content="#050D1F" />
    <meta name="color-scheme" content="dark light" />
    <title>Beast-Trader — AI Crypto Trading, Made Simple</title>
    <meta
      name="description"
      content="Follow the coins you care about. Beast watches them for you and tells you what it thinks, in plain English."
    />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Social sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Beast-Trader" />
    <meta property="og:title" content="Beast-Trader — AI Crypto Trading, Made Simple" />
    <meta
      property="og:description"
      content="Follow the coins you care about. Beast watches them for you and tells you what it thinks."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Beast-Trader — AI Crypto Trading, Made Simple" />
    <meta
      name="twitter:description"
      content="Follow the coins you care about. Beast watches them for you and tells you what it thinks."
    />
    <meta name="twitter:image" content="/twitter-card.jpg" />

    <!-- iOS launch screens: background matches the wordmark exactly, so the
         handoff from splash to app is invisible. -->
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/splash/iphone-pro.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/splash/iphone-pro.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 1)" href="/splash/iphone-portrait.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 768px) and (device-height: 1024px) and (-webkit-device-pixel-ratio: 2)" href="/splash/ipad-portrait.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 768px) and (-webkit-device-pixel-ratio: 2)" href="/splash/ipad-landscape.jpg" />
    <link rel="apple-touch-startup-image" media="(device-width: 2796px) and (device-height: 1290px) and (-webkit-device-pixel-ratio: 1)" href="/splash/iphone-landscape.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
